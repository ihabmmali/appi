name: release-verify

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Full verification runs only for explicit manual runs or a release
  # packaging commit. Main and ordinary release-branch maintenance commits do
  # not run this gate; release candidates are verified before packaging.
  verify:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' &&
         startsWith(github.ref, 'refs/heads/release/') &&
         contains(github.event.head_commit.message, '[package]'))
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synchronize generated package with manifest
        run: python3 tools/build_repository.py
      - name: Unit and smoke tests
        run: python3 -m unittest discover -s tests
      - name: Workflow tracker validation
        run: python3 tools/check_workflow.py
      - name: Rebuild repository artifacts
        run: python3 tools/build_repository.py
      - name: Inspect package and repository output
        run: |
          python3 - <<'PY'
          import hashlib
          import xml.etree.ElementTree as ET
          import zipfile
          from pathlib import Path

          root = Path('.')
          addon = ET.parse(root / 'plugin.video.appi' / 'addon.xml').getroot()
          version = addon.attrib['version']
          package = root / 'plugin.video.appi' / f'plugin.video.appi-{version}.zip'
          assert package.is_file(), package
          with zipfile.ZipFile(package) as z:
              names = z.namelist()
              assert names and all(name == 'plugin.video.appi/' or name.startswith('plugin.video.appi/') for name in names)
              assert z.testzip() is None
              manifest = ET.fromstring(z.read('plugin.video.appi/addon.xml'))
              assert manifest.attrib['version'] == version
          sidecar = package.with_name(package.name + '.sha256')
          expected = sidecar.read_text().strip()
          actual = hashlib.sha256(package.read_bytes()).hexdigest()
          assert expected == actual
          addons = (root / 'addons.xml').read_bytes()
          assert (root / 'addons.xml.sha256').read_text().strip() == hashlib.sha256(addons).hexdigest()
          index = (root / 'index.html').read_text()
          assert package.name in index
          assert 'plugin.video.appi-0.7.21.zip' in index
          assert 'plugin.video.appi-0.7.14.zip' in index
          assert 'plugin.video.appi-0.7.12.zip' in index
          assert 'plugin.video.appi-0.7.8.zip' in index
          assert index.count('plugin.video.appi-') == 10
          print('artifact inspection passed:', package.name, actual)
          PY

  package:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') && contains(github.event.head_commit.message, '[package]') }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build release artifacts
        run: python3 tools/build_repository.py
      - name: Commit deterministic release artifacts
        run: |
          git config user.name "appi-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- addons.xml addons.xml.sha256 index.html plugin.video.appi repository.appi plugin.video.appi-*.zip
          if git diff --cached --quiet; then
            echo "No generated artifact changes to commit"
          else
            git commit -m "Build Appi release artifacts"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
